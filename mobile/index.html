<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/techy-app.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <!-- iPhone and iPad home screen: a full square PNG (they ignore SVG and round the corners themselves). -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Techy App" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#163B65" />
    <script>
      // Dark (navy) or light, before the app draws, so a dark phone never flashes white (see src/data/theme.js).
      try {
        var t = localStorage.getItem('techy_theme')
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('techy-dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0E2440')
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Techy App</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="modals"></div>
    <div id="popovers"></div>

    <script>
      window.csrf_token = '{{ frappe.session.csrf_token }}'
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
